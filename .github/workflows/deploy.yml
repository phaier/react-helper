name: deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Update npm
        run: |
          npm install -g npm@latest
      - name: install
        run: |
          pnpm install
      - name: test
        run: |
          pnpm test
      - name: deploy
        run: |
          pnpm publish --provenance --access public
